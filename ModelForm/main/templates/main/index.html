{% extends "main/base.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
    <h1>Посты</h1>
    <form action="{% url 'main:add_post' %}" method="get">
        <button type="submit">Добавить пост</button>
    </form>
    <div class="posts">
        <ul>
            {% for post in posts %}
                <li>
                    <div class="post">
                        <h2>{{ post.title }}</h2>
                        <p>Автор: {{ post.author }}</p>
                        <p>Дата публикации: {{ post.created_at }}</p>
                        <a href="{% url 'main:post_info' post_id=post.id %}">Подробнее</a>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
