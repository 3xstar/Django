{% extends "base.html" %}

{% block title %}Добавление задачи{% endblock %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <p>
                {{ field.label_tag }}<br>
                {{ field }}
            </p>
        {% endfor %}
        <button type="submit">Добавить</button>
    </form>
{% endblock %}
