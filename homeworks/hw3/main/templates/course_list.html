<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Курсы</title>
</head>
<body>
    <h1>Каталог курсов</h1>
    <a href="{% url 'course_create' %}">Добавить курс</a>
    <ul>
        {% for course in courses %}
            <li>
                {{ course.title }} — {{ course.seats }}
                <a href="{% url 'course_edit' course.id %}">Редактировать</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
