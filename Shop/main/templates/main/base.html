{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef3f8">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="{% url 'main:store' %}">Store</a>
            <a class="admin-link" href="{% url 'admin:index' %}">Админ-панель <span aria-hidden="true">↗</span></a>
        </div>
    </header>
    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">Каталог товаров</div>
    </footer>
</body>
</html>
