{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171411">
    <title>{% block title %}Insert Coin — Arcade Archive{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body data-style="neon">
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}" aria-label="Insert Coin home">
            <span class="brand__coin">●</span> INSERT<span>COIN</span>
        </a>
        <nav class="topbar__nav" aria-label="Main navigation">
            <a href="#library">Game library</a>
            <a href="#cabinet">Arcade cabinet</a>
            <a href="#how-to">How to play</a>
        </nav>
        <span class="topbar__status"><i></i> CABINET ONLINE</span>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <span>INSERT COIN</span>
        <span>ORIGINAL ARCADE GAMES. NO DOWNLOADS REQUIRED.</span>
        <a href="#top">BACK TO TOP ↑</a>
    </footer>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
